{% extends 'catalog/base.html' %}
{% block content %}
<h1>Удалить статью</h1>
<p>Ты действительно хочешь удалить статью "{{ object.title }}"?</p>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Да, удалить</button>
</form>
<a href="{% url 'blog:detail' object.pk %}">Отмена</a>
{% endblock %}
