{% extends 'catalog/base.html' %}
{% block content %}
<h1>{{ post.title }}</h1>
{% if post.preview %}
    <img src="{{ post.preview.url }}"
    alt="{{ post.title }}"
    width="400">
    {% endif %}
<div>{{ post.content|linebreaks }}</div>
<p>Дата создания:{{ post.created_at }}</p>
<p>Просмотров:{{ post.views_count }}</p>
<a href="{% url 'blog:list' %}">Вернуться к списку статей</a>
{% endblock %}
