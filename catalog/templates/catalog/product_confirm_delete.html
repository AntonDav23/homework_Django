{% extends 'catalog/base.html' %}
{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">Удаление товара</h2>
    <p>Ты действительно хочешь удалить товар "{{ object.name }}"?</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'catalog:home' %}" class="btn btn-secondary>Отмена</a>
    </form>
</div>
{% endblock %}
