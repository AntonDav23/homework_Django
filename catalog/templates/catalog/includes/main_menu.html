<nav class="ms-5">
    <a class="p-2 btn btn-outline-primary" href="/catalog/">Каталог</a>
    <a class="p-2 btn btn-outline-primary" href="/catalog/contacts/">Контакты</a>
    <a class="p-2 btn btn-outline-primary" href="/blog/">Блог</a>

    {% if user.is_authenticated %}
        <a class="p-2 btn btn-outline-primary" href="{% url 'users:profile' %}">Мой профиль</a>
        <form method="post" action="{% url 'users:logout' %}" style="display: inline;">
            {% csrf_token %}
            <button type="submit" class="p-2 btn btn-outline-danger">Выйти</button>
        </form>
    {% else %}
        <a class="p-2 btn btn-outline-success" href="{% url 'users:login' %}">Войти</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'users:register' %}">Регистрация</a>
    {% endif %}
</nav>
